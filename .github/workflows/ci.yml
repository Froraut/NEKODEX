name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      broad_verification_authorized:
        description: "I explicitly authorize the full three-platform verify, packaging, and smoke checks for this run after focused development verification"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require explicit broad-run authorization
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BROAD_VERIFICATION_AUTHORIZED: ${{ inputs.broad_verification_authorized }}
        run: test "$BROAD_VERIFICATION_AUTHORIZED" = "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Check architecture map and documented paths
        if: runner.os == 'Linux'
        run: bun run architecture:check
      - name: Install runtime dependencies for the connector ABI check
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun install --frozen-lockfile
      - name: Install renderer dependencies for focused source checks
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Check both source targets including new contract modules
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: |
          bun run typecheck
          bun run launcher:typecheck
      - name: Check published ChatGPT connector ABIs
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun run connector-abi:check
      - name: Check README downloads and version pins
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun run check-version
      - name: Install the headless browser for DOM regression tests
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun x --no-install playwright-core install --with-deps chromium-headless-shell
      - name: Run focused Web regression tests
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun run test:regressions
      - name: Run selective workflow feature regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun run test:selective-adoption
      - name: Run focused tunnel credential regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun run test:tunnel-credentials
      - name: Run Native readiness and passive Python environment regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/native-account-execution.test.ts tests/skill-python-environment.test.ts --timeout 10000
      - name: Run persistent Native ownership regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/persistent-native-conversations.test.ts tests/native-persistent-ipc.test.ts tests/native-account-ipc.test.ts --timeout 10000
      - name: Run focused Native schema, selected input and consent contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/agent-native-wait-context.test.ts tests/native-selected-attachments.test.ts tests/agent-mode-multistage.test.ts tests/conversation-history-events.test.ts --timeout 10000
      - name: Run independent semantic review and fixed control refusal contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/agent-mode-semantic-review.test.ts tests/agent-mode-control-error.test.ts --timeout 10000
      - name: Run successful browser session presentation regression
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/browser-session-presentation.test.ts tests/browser-personalization-readiness.test.ts tests/agent-provider-failed-terminal.test.ts --timeout 10000
      - name: Run bounded Loop ingress and owner recovery contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/agent-loop-external-producer.test.ts tests/loop-file-watcher-recovery.test.ts tests/loop-file-watcher-integration.test.ts --timeout 10000
      - name: Run owned text history and exact OAuth callback contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/owned-conversation-text.test.ts tests/conversation-history-owned-conversation.test.ts tests/conversation-history-owned-bridge.test.ts tests/agent-oauth-exact-redirect.test.ts tests/oauth-mcp-task-availability.test.ts --timeout 10000
      - name: Run isolated VM protocol regressions without booting a VM
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/execution-vm-contract.test.ts tests/python-build-scope-status.test.ts tests/python-build-http-diagnostic.test.ts tests/execution-vm-network-grant-http.test.ts --timeout 10000
      - name: Run passive VM admission, export, delivery integrity and release input contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/execution-vm-production-runtime.test.ts tests/execution-vm-export-contract.test.ts tests/execution-vm-network.test.ts tests/python-build.test.ts tests/delivery-integrity.test.ts tests/native-release-inputs.test.ts --timeout 10000
      - name: Run passive dependency, OAuth and selected-page contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/skill-python-requirements.test.ts tests/agent-oauth.test.ts tests/browser-companion-dispatch.test.ts tests/browser-companion-firefox.test.ts tests/browser-companion-chatgpt.test.ts tests/browser-companion-chatgpt-page.test.ts tests/browser-companion-store-package.test.ts --timeout 10000
      - name: Run scoped local API consumer regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/local-control-api-client.test.ts --timeout 10000
      - name: Run selected Python resource and approval flow regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/agent-skill-python-flow.test.ts tests/agent-skill-script-resources.test.ts tests/agent-skill-script-tools.test.ts --timeout 10000
      - name: Run remote Git review ownership regressions
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/remote-git-review.test.ts tests/remote-git-review-facade.test.ts tests/remote-workspace-lifecycle.test.ts --timeout 30000
      - name: Run passive usage provenance and estimate contracts
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: bun test tests/usage-pricing.test.ts tests/external-usage-formats.test.ts --timeout 10000
      - name: Validate launcher installer with Windows PowerShell 5.1
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - run: bun install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch'
      - run: bun install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch'
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.3 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
        if: github.event_name == 'workflow_dispatch'
      - run: bun run app:package
        if: github.event_name == 'workflow_dispatch'
      - name: Verify Linux AppImage ABI on current Arch
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
        if: github.event_name == 'workflow_dispatch'

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
