name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_preview:
        description: Also build an unsigned Windows x64 preview Actions artifact (prerelease tags only). It is never published and never gates the release.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Releases are built and published for macOS Apple Silicon (arm64) only (owner decision,
# 2026-10-21). Intel is not built; Windows and Linux come later. Publication depends on
# the arm64 build alone, so no other platform can block a release.
jobs:
  plan:
    # Prerelease tags wait for an explicit dispatch; stable tags release on push.
    if: github.repository == 'Froraut/NEKODEX' && (github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: plan
        name: Validate the release tag and select the macOS arm64 build
        run: node scripts/release-plan.cjs

  build:
    needs: plan
    environment: release-signing
    timeout-minutes: 90
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require the Apple Silicon release runner
        run: test "$(uname -s)/$(uname -m)" = "Darwin/arm64"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Check release version consistency
        run: bun run check-version
      - name: Fetch the accepted macOS arm64 Native inputs pinned by the source lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-release-inputs.cjs fetch
      - name: Prepare macOS publisher credentials
        env:
          CSC_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          CSC_NAME: ${{ vars.MACOS_DEVELOPER_ID_NAME }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_NOTARY_API_ISSUER }}
        run: node scripts/prepare-release-signing-macos.cjs
      - name: Package authenticated publisher release
        env:
          CODEX_WEB_GPT_RELEASE: "1"
          CSC_NAME: ${{ vars.MACOS_DEVELOPER_ID_NAME }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_NOTARY_API_ISSUER }}
        # Behavior checks belong to the reviewed source change. Packaging keeps
        # the mandatory native signature, notarization and integrity gates.
        run: |
          bun run --cwd launcher build:renderer
          bun run --cwd launcher build:runtime
          bun run --cwd launcher scripts/package.cjs
      - name: Archive runtime
        run: tar -czf "${{ matrix.runtime_asset }}" -C launcher/build/runtime .
      - name: Build third-party notices
        run: bun run licenses
      - name: Upload third-party notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notices
          path: dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
          if-no-files-found: error
      - name: Remove temporary macOS signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/codex-web-release-signing/release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/codex-web-release-signing"

  # Opt-in development artifact only: publish never needs this job.
  windows-preview:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.windows_preview && contains(github.ref_name, '-')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.3 -GitHubEnv $env:GITHUB_ENV
      - name: Build explicitly unsigned Windows preview
        env:
          CODEX_WEB_GPT_RELEASE: "0"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run --cwd launcher build:renderer
          bun run --cwd launcher build:runtime
          bun run --cwd launcher scripts/package.cjs --win
      - name: Mark preview and record artifact integrity
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version.Contains('-')) { throw 'Unsigned preview requires a prerelease version' }
          $files = Get-ChildItem launcher/artifacts -File | Where-Object { $_.Extension -in '.exe','.zip' }
          if ($files.Count -ne 2) { throw 'Expected exactly the Windows installer and ZIP' }
          "UNSIGNED WINDOWS PREVIEW`nVersion: $version`nSource: $env:GITHUB_SHA`nThis development build has no Authenticode publisher signature. It is not an authenticated in-app update. Integrity hashes do not replace a publisher certificate." | Set-Content launcher/artifacts/UNSIGNED-PREVIEW.txt -Encoding utf8
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content launcher/artifacts/preview-checksums.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NEKODEX-${{ github.ref_name }}-windows-x64-unsigned
          path: |
            launcher/artifacts/*.exe
            launcher/artifacts/*.zip
            launcher/artifacts/UNSIGNED-PREVIEW.txt
            launcher/artifacts/preview-checksums.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    # The macOS arm64 build is the only dependency of publication.
    needs: build
    environment: release-publishing
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.3.md release-assets/Bun-1.4.3.md
          cp LICENSES/libnotify-0.8.7-LGPL-2.1.md release-assets/libnotify-0.8.7-LGPL-2.1.md
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Sign release metadata with the fork trust key
        env:
          RELEASE_METADATA_SIGNING_KEYS: ${{ secrets.RELEASE_METADATA_SIGNING_KEYS }}
        run: node scripts/sign-release-metadata.cjs release-assets
      - name: Attest final assets and signed metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Publish only after signature and draft digest verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs release-assets
