<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Chrome profile</title>
  <link rel="stylesheet" href="chrome-profile-picker.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow" id="eyebrow">Google Chrome Stable</p>
      <h1 id="title">Choose a Chrome profile</h1>
      <p class="intro" id="intro">Google profile details are shown below. Your ChatGPT account is verified separately before connecting.</p>
    </header>
    <div class="search-heading">
      <label class="search-label" for="search" id="search-label">Search profiles</label>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
    <input id="search" type="search" autocomplete="off" spellcheck="false" aria-controls="profiles" placeholder="Name, Google email, or profile">
    <div id="profiles" class="profiles" role="listbox" aria-labelledby="title"></div>
    <!-- Shown in place of the list when no profile is shown; the status line above announces it. -->
    <div id="empty" class="empty" hidden>
      <svg class="empty-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></svg>
      <div class="empty-copy">
        <strong id="empty-title" aria-hidden="true"></strong>
        <p id="empty-body"></p>
        <button id="clear" class="secondary" type="button" hidden>Clear search</button>
      </div>
    </div>
    <footer>
      <button id="cancel" class="secondary" type="button">Cancel</button>
      <button id="new" class="secondary" type="button">New isolated sign-in</button>
      <button id="connect" class="primary" type="button" disabled>Continue</button>
    </footer>
  </main>
  <script src="chrome-profile-picker-renderer.js"></script>
</body>
</html>
