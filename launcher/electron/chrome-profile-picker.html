<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Chrome profile</title>
  <link rel="stylesheet" href="chrome-profile-picker.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow" id="eyebrow">Connect Google Chrome Stable</p>
      <h1 id="title">Choose a Chrome Stable profile</h1>
      <p class="intro" id="intro">These profiles belong to Google Chrome Stable. The Google account shown here is profile metadata. NEKODEX verifies the actual ChatGPT account separately before changing your saved session.</p>
    </header>
    <label class="search-label" for="search" id="search-label">Search profiles</label>
    <input id="search" type="search" autocomplete="off" spellcheck="false" aria-controls="profiles" placeholder="Name, Google email, or profile">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="profiles" class="profiles" role="listbox" aria-labelledby="title"></div>
    <footer>
      <button id="cancel" class="secondary" type="button">Cancel</button>
      <button id="new" class="secondary" type="button">Use a new isolated sign-in</button>
      <button id="connect" class="primary" type="button" disabled>Continue</button>
    </footer>
  </main>
  <script src="chrome-profile-picker-renderer.js"></script>
</body>
</html>
